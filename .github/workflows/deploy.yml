name: Deploy to Firebase Hosting

on:
  push:
    branches: [claude/firebase-integration-9f00rl]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Needs a FIREBASE_SERVICE_ACCOUNT repository secret: the JSON key of a
      # service account with the "Firebase Hosting Admin" role. Without it the
      # job stops here with a clear message instead of a confusing auth error.
      - name: Check for deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: homie-f7172
          channelId: live
